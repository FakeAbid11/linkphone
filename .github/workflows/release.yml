name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build signed-with-debug-key APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - name: Rename
        run: cp android/app/build/outputs/apk/debug/app-debug.apk linkphone-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: linkphone-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: desktop/release/*.exe

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkPhone ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Microsoft Phone Link, rebuilt from scratch: your Android phone on your PC over the
            local network. No account, no cloud, no relay server.

            ## Install

            1. **Phone** — download `linkphone-android.apk` and install it (allow "install unknown
               apps" when asked).
            2. **PC** — download and run `LinkPhone Setup 0.1.0.exe`. SmartScreen will warn because
               the installer is unsigned: *More info → Run anyway*. Allow it on **private**
               networks when Windows Firewall asks.
            3. Make sure both devices are on the same Wi-Fi (not a guest network).
            4. On the PC, read the pairing code in the sidebar.
            5. On the phone: **Scan** → tap your PC → type the code.
            6. On the phone: **Open settings** → allow notification access for LinkPhone.

            ## In this build

            * Pairing with a one-time code (PBKDF2 + AES-256-GCM, no account)
            * mDNS discovery — no IP addresses to type
            * Notification mirroring with inline reply from the PC
            * Two-way file transfer
            * Clipboard sync (phone → PC only while the app is open, an Android restriction)
            * Auto-reconnect

            ## Not in this build

            SMS, phone calls, screen mirroring and app streaming. See the README roadmap: SMS needs
            the default-SMS-app role, and call audio can only work over Bluetooth HFP.

            Windows only for the desktop app. Android 10+ for the phone. iOS is out of scope (no SMS
            or notification APIs).
          files: |
            artifacts/android-release/linkphone-android.apk
            artifacts/windows-installer/*.exe
