name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Restore Android signing key
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/linkphone-release.jks"
      - name: Build signed APK
        working-directory: android
        run: gradle assembleRelease --no-daemon
        env:
          LINKPHONE_KEYSTORE_PATH: ${{ runner.temp }}/linkphone-release.jks
          LINKPHONE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LINKPHONE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LINKPHONE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      - name: Rename
        run: cp android/app/build/outputs/apk/release/app-release.apk linkphone-android.apk
      - uses: actions/upload-artifact@v5
        with:
          name: android-release
          path: linkphone-android.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: desktop/package-lock.json
      - name: Install
        working-directory: desktop
        run: npm ci --no-audit --no-fund
      - name: Build installer
        working-directory: desktop
        run: npm run dist:win
      - uses: actions/upload-artifact@v5
        with:
          name: windows-installer
          path: |
            desktop/release/*.exe
            desktop/release/*.blockmap
            desktop/release/latest.yml

  publish:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v5
        with:
          path: artifacts
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: LinkPhone ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          body: |
            Microsoft Phone Link, rebuilt from scratch: your Android phone on your PC over the
            local network. No account, no cloud, no relay server.

            ## Install

            1. **Phone** — download `linkphone-android.apk` and install it (allow "install unknown
               apps" when asked).
               **If v0.1 is installed, uninstall it first and pair again.** v0.1 used a temporary
               CI signing key; v0.2 started the permanent signing key. v0.2+ update in place.
            2. **PC** — download and run `LinkPhone.Setup.0.12.18.exe`. SmartScreen will warn because
               the installer is unsigned: *More info → Run anyway*. Allow it on **private**
               networks when Windows Firewall asks.
            3. Make sure both devices are on the same Wi-Fi (not a guest network).
            4. On the PC, click **Scan QR code instead** in the sidebar.
            5. On the phone: **Scan QR** and point the camera at the PC. Network scan + typed code is
               still available as a fallback.
            6. On the phone, open notification settings, then tap **Allow SMS access** and
               **Allow photo access**.
            7. For calls, tap **Set as default phone app**, accept Android's role prompt, then allow
               phone permissions.

            ## In this build

            * One-tap QR pairing, fully offline with CameraX + ZXing (no Google Play Services)
            * Pairing code fallback (PBKDF2 + AES-256-GCM, no account)
            * mDNS discovery — no IP addresses to type
            * Notification mirroring with inline reply from the PC
            * Notification quick actions and open-on-phone from the PC
            * Contacts now sit beside the dialer in the Calls tab
            * Dual-SIM: choose the SIM for texts and calls, with SIM labels on messages, calls and history
            * Live notification progress: downloads, updates and file copies update in place
            * Explorer Send-to: right-click files and send them to the phone
            * Automatic update checks with notifications on Windows and Android
            * Notification center: group by app, search, and mute or clear an app
            * Drag files from Explorer onto the LinkPhone window to send them
            * Background service no longer capped at six hours, starts at boot when paired, and
              offers an optional battery-optimization exemption
            * Paired phones find each other again after reboot, app restart or a PC IP change
            * Recent calls and contacts share one switch beside the dialer
            * Three-step Android onboarding: intro, permissions and pairing
            * Dial from the PC without making LinkPhone the default phone app; full call control
              stays optional
            * Contacts reload after access is granted; outgoing calls show a PC confirmation
            * Clear guidance to enable the PC in-call card, speaker and hang-up
            * PC call controls without the default-phone role — best effort
            * PC call card now falls back to the phone’s call state when the dialer notification is hidden
            * Dismiss or clear notifications on the PC and the phone shade follows
            * Restart & install now updates silently and relaunches LinkPhone
            * Reliability fixes for calls, notifications and contacts
            * UI/UX polish: connection-aware controls, confirmations and persistent Calls state
            * Notification history with search, new SMS conversations, find-my-phone and media controls
            * Stop find-my-phone from the phone (in-app card or notification action) or from the PC
            * SMS drafts stay with their conversation, and sending while offline keeps your text
            * Clear all respects Live/History and asks first; offline clipboard and file actions are disabled
            * Android: Reconnect in the status card and a collapsible Setup section
            * Setup hides the call card when call control is already ready; pairing buttons fit narrow screens
            * Share files from any Android app straight to the PC
            * Upload photos to Pictures/LinkPhone and browse or pull phone downloads from the PC
            * Transfer history survives restarts; interrupted transfers can retry or resume
            * Videos tab with posters, durations and inline playback with seeking
            * Send photos and videos from the PC into the phone gallery
            * Clear prompts when Android video access is missing or limited to selected items
            * Downloaded videos stay playable after a LinkPhone restart; duplicate downloads and moved files are handled cleanly
            * Stability pass: faster large transfers, no duplicate SMS, consistent photo/video state and clearer offline states
            * Rename the phone from the PC or phone, low-battery alerts, and pause Windows notification toasts
            * Media card now shows album art and lets you seek and change phone volume
            * Call mute from the PC, a 5–30 s find-my-phone ring, transfer cancel and failed-SMS retry
            * Notification reliability: group, ongoing and MessagingStyle alerts mirror, reconnects backfill, and a disconnected listener can rebind
            * Review fixes: rapid notifications, calendar vs call detection, pairing rate limiting, SMS retry and disconnect states
            * Clipboard text sync both ways, optional background accessibility mode, Pull from phone, and offline retry
            * Calls dialed from the PC show the dialed number, dial until connected, then a talk timer that starts on connect
            * New messages suggest contacts while you type, and a contact without a thread starts a prefilled text
            * Notification reply always shows when the app supports it, targets the right action after updates, and reports sent/failed
            * Role-less calls: connect time, real audio route and waiting calls; mute works and restores on hang-up
            * VoIP call control from the PC: answer, decline and hang up WhatsApp, Telegram, Messenger and Instagram calls
            * One card per call: re-posted call notifications update the same card and reconnect rebuilds the call list
            * Ongoing system notifications (Continuity, Networking, VPN, music) no longer appear as calls
            * UI pass: one type scale, 4px spacing rhythm, compact call rows with a mono timer, monochrome error emphasis
            * Android UI foundation: one theme and type scale, duplicate palettes removed, Share scrolls, QR scrim
            * Android UI finished: shared permission cards, onboarding recovery, device rows and state transitions
            * Android polish: animated connection status and progress, step rows in onboarding, precise settings links
            * Photo and file saving fixed: the PC acknowledges incoming chunks, so phone→PC transfers complete
            * Existing SMS conversations, live incoming texts and replies from the PC
            * Phone photo albums with thumbnails, large preview and original download
            * Live phone battery percentage and charging state
            * Built-in Windows updater with download progress and restart-to-install
            * Built-in Android updater with SHA-256 and signing-certificate verification
            * Dial and receive calls from Windows: answer, decline, hang up and phone-speaker toggle
            * Minimal phone-side incoming/in-call UI for use while Windows is offline
            * Android connection hotfix restoring the proven v0.1 socket lifecycle
            * Foreground link service starts before the socket, matching v0.1 on restrictive OEMs
            * Re-pairing recovery: a fresh QR re-pairs even if the PC still remembers the phone
            * Wi-Fi pairing over link-local IPv6 when the router isolates IPv4 clients
            * Contact names in SMS threads and calls (optional READ_CONTACTS permission)
            * Strictly monochrome Material 3 theme on PC and Android with Material Symbols Rounded icons
            * Removed the desktop File/Edit/View menu bar for a cleaner window
            * New monochrome phone + laptop + link logo for the installer, app, tray, Android launcher, themed icon, and in-app header
            * Tray icon now uses the full phone + laptop + link mark
            * Optional Start with Windows, launching hidden in the tray and listed in Windows Startup Apps
            * Fixed the Start with Windows toggle state so it reflects Windows Startup Apps
            * New phone + link notification icon with a gray accent (no more teal system tint)
            * Searchable contacts on the PC with click-to-call and existing-thread messaging
            * Recent call history with direction, time, duration and call-back
            * Optional Call logs permission for call history (sideloaded APK)
            * Two-way file transfer
            * Clipboard sync (phone → PC only while the app is open, an Android restriction)
            * Auto-reconnect

            ## Not in this build

            MMS, new SMS conversations, call audio on the PC, screen mirroring and app streaming.
            Call audio deliberately remains on the phone.

            Windows only for the desktop app. Android 10+ for the phone. iOS is out of scope (no SMS
            or notification APIs).

            v0.4 must be installed manually once. Future releases can be initiated inside both apps;
            Android will always require its system installation confirmation.
          files: |
            artifacts/android-release/linkphone-android.apk
            artifacts/windows-installer/*.exe
            artifacts/windows-installer/*.blockmap
            artifacts/windows-installer/latest.yml
