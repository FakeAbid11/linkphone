<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="LinkPhone — your Android phone on your Windows PC">
  <rect x="1" y="1" width="1278" height="358" rx="28" fill="#000000" stroke="#2E2E2E" stroke-width="2"/>

  <g transform="translate(1000,-70) scale(1.3)" opacity="0.10" fill="none" stroke="#FFFFFF">
    <rect x="76" y="150" width="72" height="212" rx="16" stroke-width="16"/>
    <rect x="286" y="150" width="156" height="142" rx="14" stroke-width="16"/>
    <rect x="94" y="172" width="36" height="8" rx="4" fill="#FFFFFF" stroke="none"/>
    <rect x="268" y="310" width="192" height="22" rx="11" fill="#FFFFFF" stroke="none"/>
    <rect x="168" y="230" width="56" height="48" rx="24" stroke-width="14"/>
    <rect x="206" y="230" width="56" height="48" rx="24" stroke-width="14"/>
  </g>

  <g transform="translate(56,52) scale(0.5)">
    <g fill="none" stroke="#FFFFFF" stroke-width="16">
      <rect x="76" y="150" width="72" height="212" rx="16"/>
      <rect x="286" y="150" width="156" height="142" rx="14"/>
    </g>
    <rect x="94" y="172" width="36" height="8" rx="4" fill="#FFFFFF"/>
    <rect x="268" y="310" width="192" height="22" rx="11" fill="#FFFFFF"/>
    <g fill="none" stroke="#FFFFFF" stroke-width="14">
      <rect x="168" y="230" width="56" height="48" rx="24"/>
      <rect x="206" y="230" width="56" height="48" rx="24"/>
    </g>
  </g>

  <g font-family="Segoe UI, system-ui, sans-serif">
    <text x="330" y="138" fill="#FFFFFF" font-size="46" font-weight="600">Your Android phone,</text>
    <text x="330" y="188" fill="#FFFFFF" font-size="46" font-weight="600">on your Windows PC.</text>
    <text x="330" y="230" fill="#B3B3B3" font-size="24">Calls, messages, notifications, photos and files — no cloud.</text>

    <g>
      <rect x="330" y="258" width="150" height="42" rx="21" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1.5"/>
      <rect x="494" y="258" width="156" height="42" rx="21" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1.5"/>
      <rect x="664" y="258" width="184" height="42" rx="21" fill="#1C1C1C" stroke="#3A3A3A" stroke-width="1.5"/>
      <text x="405" y="285" fill="#B3B3B3" font-size="17" letter-spacing="1.6" text-anchor="middle">LOCAL ONLY</text>
      <text x="572" y="285" fill="#B3B3B3" font-size="17" letter-spacing="1.6" text-anchor="middle">NO ACCOUNT</text>
      <text x="756" y="285" fill="#B3B3B3" font-size="17" letter-spacing="1.6" text-anchor="middle">AES-256-GCM</text>
    </g>
  </g>
</svg>
